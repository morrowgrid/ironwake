<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none}#app{position:fixed;inset:0}</style>
</head><body><div id="app"></div>
<script>
function startGame(root) {
  const ROWS = [
    '########################',
    '#......#........#......#',
    '#..e...%...e....%...e..#',
    '#......#........#......#',
    '#####.####..#####.######',
    '#......................#',
    '#...e....%......%....e.#',
    '#........%......%......#',
    '#...##............##...#',
    '#...##....%%%%....##...#',
    '#.........%%%%.........#',
    '#..e......%%%%......e..#',
    '#.........%==%.........#',
    '#...##............##...#',
    '#...##............##...#',
    '#......%........%......#',
    '#..e...%........%...e..#',
    '######.####..####.######',
    '#......#........#......#',
    '#..e...=...S....=...e..#',
    '#......#........#......#',
    '########################',
  ];
  const MH = ROWS.length, MW = ROWS[0].length;
  const grid = ROWS.map(r => [...r].map(c => (c === '#' ? 1 : c === '%' ? 2 : c === '=' ? 3 : 0)));
  const spawns = [];
  let start = { x: 12.5, y: 19.5 };
  ROWS.forEach((r, y) => [...r].forEach((c, x) => {
    if (c === 'e') spawns.push({ x: x + 0.5, y: y + 0.5 });
    if (c === 'S') start = { x: x + 0.5, y: y + 0.5 };
  }));
  const openCells = [];
  grid.forEach((r, y) => r.forEach((c, x) => { if (!c) openCells.push({ x: x + 0.5, y: y + 0.5 }); }));

  // ---------- DOM ----------
  root.innerHTML = '';
  const css = document.createElement('style');
  css.textContent = `
  .iw{position:fixed;inset:0;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;color:#dff6ff;z-index:99999}

  .iw .xh:after{top:10px;left:0;height:2px;width:22px;-webkit-mask:linear-gradient(90deg,#000 0 30%,transparent 30% 70%,#000 70%);mask:linear-gradient(90deg,#000 0 30%,transparent 30% 70%,#000 70%)}

  .iw .swap{right:30px;bottom:150px;width:56px;height:56px}
  .iw .rel{right:100px;bottom:122px;width:50px;height:50px;font-size:10px}
  .iw .auto{right:174px;bottom:122px;width:50px;height:50px;font-size:10px}
  .iw .joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #bff6ff66;background:#0b2a3c44;pointer-events:none;display:none}
  .iw .joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#bff6ffaa}
  .iw .joyhint{position:absolute;left:28px;bottom:max(44px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:2px dashed #bff6ff44;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:10px;opacity:.7;letter-spacing:.1em}
  .iw .menu{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#12304a,#03070d 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:20}
  .iw .menu h1{margin:0;font-size:38px;letter-spacing:.28em;font-weight:800;color:#bff6ff}
  .iw .menu p{margin:8px 0;max-width:340px;font-size:14px;opacity:.9;line-height:1.4}
  .iw .menu .go{margin-top:16px;padding:14px 30px;border-radius:30px;background:#4fd0ff;color:#02202e;font-weight:800;letter-spacing:.15em;font-size:15px}
  .iw .menu small{margin-top:14px;opacity:.6;font-size:11px}
  `;
  const el = document.createElement('div');
  el.className = 'iw';
  el.innerHTML = `
  <canvas></canvas>
  <div class="layer touch"></div>
  <div class="fx dmg" style="background:radial-gradient(ellipse at center,transparent 40%,#ff2010 120%)"></div>
  <div class="fx shf" style="background:radial-gradient(ellipse at center,transparent 45%,#30b8ff 130%)"></div>
  <div class="fx boom" style="background:#fff"></div>
  <div class="hud"><div class="lab">SHIELD</div><div class="bar sh"><i></i></div><div class="lab">HEALTH</div><div class="bar hp"><i></i></div></div>
  <div class="tr">WAVE <b class="wv">1</b><br>HOSTILES <b class="en">0</b><br>SCORE <b class="sc">0</b></div>
  <div class="xh"></div>
  <div class="msg"></div>
  <div class="ammo"><span class="wn">RIFLE</span><b class="am">32</b><span class="rs">/ 160</span></div>
  <div class="joyhint">MOVE</div>
  <div class="joy"><i></i></div>
  <div class="btn fire" data-k="fire">FIRE</div>
  <div class="btn gren" data-k="gren">GRENADE<br><b class="gc">3</b></div>
  <div class="btn swap" data-k="swap">SWAP</div>
  <div class="btn rel" data-k="rel">RELOAD</div>
  <div class="btn auto on" data-k="auto">AUTO<br>AIM</div>
  <div class="menu">
    <h1>IRONWAKE</h1>
    <p>The colony ship went dark. Clear five waves of Skarn raiders from the hangar deck. Your armor shield recharges when you break contact. Health does not.</p>
    <p><b>Left thumb</b> move. <b>Drag right side</b> to look. <b>FIRE</b> shoots, <b>GRENADE</b> throws. Rifle auto-fires when an enemy is in your crosshair (toggle AUTO AIM).</p>
    <div class="go">TAP TO DEPLOY</div>
    <small>Keyboard: WASD move, arrows or drag to look, Space fire, G grenade, Q swap, R reload. Original game by Morrowgrid Studio.</small>
  </div>`;
  root.appendChild(css); root.appendChild(el);
  const $ = s => el.querySelector(s);
  const canvas = $('canvas'); const ctx = canvas.getContext('2d');
  const touch = $('.touch'), joy = $('.joy'), joyI = $('.joy i'), joyHint = $('.joyhint');
  const shBar = $('.sh i'), hpBar = $('.hp i'), msgEl = $('.msg'), xh = $('.xh');
  const fxDmg = $('.dmg'), fxSh = $('.shf'), fxBoom = $('.boom'), menu = $('.menu');

  // ---------- audio ----------
  let ac = null;
  function initAudio() {
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.08, noise = false) {
    if (!ac) return;
    try {
      const t = ac.currentTime, g = ac.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur); g.connect(ac.destination);
      if (noise) {
        const len = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = ac.createBufferSource(); s.buffer = b; s.connect(g); s.start(t);
      } else {
        const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
        o.connect(g); o.start(t); o.stop(t + dur);
      }
    } catch (e) {}
  }
  const sfx = {
    rifle: () => { tone(900, 160, 0.09, 'sawtooth', 0.06); tone(0, 0, 0.06, 'square', 0.05, true); },
    pistol: () => { tone(500, 70, 0.18, 'sawtooth', 0.09); tone(0, 0, 0.1, 'square', 0.07, true); },
    boom: () => { tone(0, 0, 0.6, 'square', 0.25, true); tone(120, 30, 0.5, 'sine', 0.2); },
    enemy: () => tone(380, 220, 0.14, 'triangle', 0.05),
    hurt: () => tone(160, 80, 0.15, 'sawtooth', 0.07),
    hit: () => tone(1200, 800, 0.04, 'square', 0.04),
    pick: () => { tone(500, 900, 0.1, 'sine', 0.07); },
    down: () => tone(300, 40, 0.8, 'sawtooth', 0.1),
    warn: () => tone(880, 880, 0.09, 'square', 0.04),
    recharge: () => tone(300, 900, 0.5, 'sine', 0.05),
    kill: () => tone(220, 60, 0.3, 'sawtooth', 0.07),
  };

  // ---------- sprites ----------
  function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
  function tint(src, color) {
    return mk(src.width, src.height, (g, w, h) => { g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = color; g.fillRect(0, 0, w, h); });
  }
  function ell(g, x, y, rx, ry, fill, stroke) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); } }
  function rr(g, x, y, w, h, r, fill, stroke) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); } }
  const gruntImg = mk(64, 80, (g) => {
    rr(g, 18, 62, 11, 16, 3, '#3a2a22', '#120a08'); rr(g, 35, 62, 11, 16, 3, '#3a2a22', '#120a08');
    rr(g, 20, 28, 24, 6, 3, '#555e66', '#111');
    ell(g, 32, 48, 19, 21, '#d9822b', '#2a1405');
    rr(g, 24, 30, 6, 22, 3, '#7a8793', '#111'); rr(g, 34, 30, 6, 22, 3, '#7a8793', '#111');
    ell(g, 32, 25, 14, 13, '#8a4fb0', '#1c0a28');
    rr(g, 21, 21, 22, 8, 4, '#120c18', null); ell(g, 27, 25, 3, 2.2, '#ffe066'); ell(g, 37, 25, 3, 2.2, '#ffe066');
    rr(g, 44, 40, 18, 7, 3, '#2d3138', '#000'); ell(g, 62, 43, 3, 3, '#5dff8a');
    rr(g, 40, 38, 8, 9, 3, '#d9822b', '#2a1405');
  });
  const eliteImg = mk(72, 108, (g) => {
    rr(g, 22, 82, 12, 24, 4, '#1b2a55', '#050a1a'); rr(g, 38, 82, 12, 24, 4, '#1b2a55', '#050a1a');
    rr(g, 12, 30, 48, 14, 7, '#5b8bea', '#0a1330');
    rr(g, 18, 36, 36, 52, 9, '#3b6fd1', '#0a1330');
    rr(g, 28, 46, 16, 22, 4, '#274a99', null);
    rr(g, 8, 36, 10, 40, 5, '#4a7ee0', '#0a1330'); rr(g, 54, 36, 10, 40, 5, '#4a7ee0', '#0a1330');
    ell(g, 36, 22, 14, 16, '#2b3d70', '#050a1a');
    rr(g, 25, 18, 22, 7, 3, '#0a1a2a', null); rr(g, 27, 19, 18, 4, 2, '#7ef5ff', null);
    g.fillStyle = '#1b2a55'; g.beginPath(); g.moveTo(24, 28); g.lineTo(30, 38); g.lineTo(26, 38); g.fill(); g.beginPath(); g.moveTo(48, 28); g.lineTo(42, 38); g.lineTo(46, 38); g.fill();
    rr(g, 54, 58, 18, 8, 3, '#2d3138', '#000'); ell(g, 71, 62, 3, 3.5, '#ff6bf5');
    ell(g, 36, 56, 33, 52, 'rgba(120,230,255,0.07)', 'rgba(120,230,255,0.35)');
  });
  const gruntHit = tint(gruntImg, 'rgba(255,255,255,0.65)'), eliteHit = tint(eliteImg, 'rgba(255,255,255,0.65)');
  const glow = (c1, c2) => mk(32, 32, (g) => { const gr = g.createRadialGradient(16, 16, 1, 16, 16, 15); gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });
  const boltG = glow('#7dff9a', 'rgba(60,255,120,0)'), boltE = glow('#ff7bf2', 'rgba(255,60,230,0)');
  const boomImg = mk(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 2, 32, 32, 31); gr.addColorStop(0, '#fff'); gr.addColorStop(0.25, '#ffe070'); gr.addColorStop(0.6, 'rgba(255,100,20,0.7)'); gr.addColorStop(1, 'rgba(255,60,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
  const sparkImg = glow('#fff6c0', 'rgba(255,200,80,0)');
  const grenImg = mk(24, 24, (g) => { ell(g, 12, 12, 8, 9, '#3f6a3a', '#0b1a0a'); rr(g, 9, 2, 6, 5, 2, '#9aa5ad', '#111'); ell(g, 12, 13, 3, 3, '#7dff9a'); });
  const healthImg = mk(40, 40, (g) => { rr(g, 3, 8, 34, 26, 5, '#e9eef2', '#1a2a33'); g.fillStyle = '#e0483c'; g.fillRect(17, 12, 6, 18); g.fillRect(11, 18, 18, 6); });
  const ammoImg = mk(40, 40, (g) => { rr(g, 5, 8, 30, 26, 4, '#4b5a3a', '#111'); g.fillStyle = '#ffd35a'; for (let i = 0; i < 4; i++) g.fillRect(9 + i * 6, 12, 4, 14); });
  const grenPickImg = mk(40, 40, (g) => { rr(g, 4, 20, 32, 14, 4, '#3a4a3a', '#111'); ell(g, 12, 16, 7, 8, '#3f6a3a', '#0b1a0a'); ell(g, 28, 16, 7, 8, '#3f6a3a', '#0b1a0a'); ell(g, 20, 12, 3, 3, '#7dff9a'); });

  // ---------- state ----------
  const P = { x: start.x, y: start.y, a: -Math.PI / 2, shield: 100, health: 100, lastHit: -99, bob: 0, alive: true, rechg: false, warnT: 0 };
  const WEAP = [
    { n: 'RIFLE', mag: 32, magMax: 32, res: 160, rate: 0.105, dmg: 11, spread: 0.035, reload: 1.3, auto: true },
    { n: 'SIDEARM', mag: 12, magMax: 12, res: 60, rate: 0.42, dmg: 34, spread: 0.008, reload: 1.0, auto: false },
  ];
  let wi = 0, grenades = 3, fireCd = 0, reloadT = 0, recoil = 0, flashT = 0, swapT = 0;
  let enemies = [], bolts = [], nades = [], booms = [], sparks = [], pickups = [];
  let wave = 0, score = 0, time = 0, state = 'menu', bannerT = 0, waveDelay = 0, hitT = 0, autoAim = true, shake = 0;
  const WAVES = 5;
  const keys = {}; const inp = { mx: 0, my: 0, fire: false, look: 0 };

  function solid(x, y) { const cx = x | 0, cy = y | 0; return cx < 0 || cy < 0 || cx >= MW || cy >= MH || grid[cy][cx] > 0; }
  function blocked(x, y, r) { return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r); }
  function tryMove(o, dx, dy, r) { if (!blocked(o.x + dx, o.y, r)) o.x += dx; if (!blocked(o.x, o.y + dy, r)) o.y += dy; }

  function cast(px, py, rdx, rdy) {
    let mx = px | 0, my = py | 0;
    const ddx = Math.abs(1 / (rdx || 1e-9)), ddy = Math.abs(1 / (rdy || 1e-9));
    let sx, sy, sdx, sdy;
    if (rdx < 0) { sx = -1; sdx = (px - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - px) * ddx; }
    if (rdy < 0) { sy = -1; sdy = (py - my) * ddy; } else { sy = 1; sdy = (my + 1 - py) * ddy; }
    let side = 0, t = 0;
    for (let i = 0; i < 64; i++) {
      if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
      if (mx < 0 || my < 0 || mx >= MW || my >= MH) { t = 99; break; }
      t = grid[my][mx];
      if (t) break;
    }
    const dist = side === 0 ? sdx - ddx : sdy - ddy;
    let wx = side === 0 ? py + dist * rdy : px + dist * rdx; wx -= Math.floor(wx);
    return { dist, side, t, wx };
  }
  function los(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy); if (d < 0.01) return true;
    return cast(ax, ay, dx / d, dy / d).dist >= d - 0.15;
  }

  // ---------- spawning ----------
  function spawnEnemy(kind, at) {
    const el = kind === 'elite';
    enemies.push({ kind, x: at.x, y: at.y, hp: el ? 110 : 45, max: el ? 110 : 45, r: el ? 0.34 : 0.3, sp: el ? 2.1 : 1.5, cool: 1 + Math.random() * 1.5, alert: false, st: (Math.random() < 0.5 ? 1 : -1), stT: Math.random() * 1.5, burst: 0, hit: 0, dead: 0, h: el ? 1.0 : 0.72, aw: 0 });
  }
  function randOpen(minD) {
    for (let i = 0; i < 80; i++) { const c = openCells[(Math.random() * openCells.length) | 0]; if (Math.hypot(c.x - P.x, c.y - P.y) > minD && !blocked(c.x, c.y, 0.2)) return c; }
    return openCells[0];
  }
  function startWave(n) {
    wave = n; bannerT = 2.6; msg('WAVE ' + n, 2.4);
    const grunts = 3 + n * 2, elites = n >= 2 ? n - 1 : 0;
    const pts = spawns.filter(s => Math.hypot(s.x - P.x, s.y - P.y) > 6);
    let k = (Math.random() * pts.length) | 0;
    for (let i = 0; i < grunts + elites; i++) {
      const p = pts[(k + i) % pts.length]; spawnEnemy(i < elites ? 'elite' : 'grunt', { x: p.x + (Math.random() - 0.5) * 0.8, y: p.y + (Math.random() - 0.5) * 0.8 });
    }
    for (let i = 0; i < 2; i++) { const c = randOpen(3); pickups.push({ x: c.x, y: c.y, t: i ? 'ammo' : 'health' }); }
    if (n % 2 === 1) { const c = randOpen(3); pickups.push({ x: c.x, y: c.y, t: 'gren' }); }
  }
  function reset() {
    P.x = start.x; P.y = start.y; P.a = -Math.PI / 2; P.shield = 100; P.health = 100; P.alive = true; P.lastHit = -99;
    WEAP[0].mag = 32; WEAP[0].res = 160; WEAP[1].mag = 12; WEAP[1].res = 60; wi = 0; grenades = 3; reloadT = 0;
    enemies = []; bolts = []; nades = []; booms = []; sparks = []; pickups = []; score = 0; wave = 0; waveDelay = 0;
    state = 'play'; startWave(1);
  }
  let msgTimer = 0;
  function msg(t, d = 2) { msgEl.textContent = t; msgEl.style.opacity = 1; msgTimer = d; }

  // ---------- combat ----------
  function damagePlayer(d) {
    if (!P.alive) return;
    P.lastHit = time; P.rechg = false;
    if (P.shield > 0) { const a = Math.min(P.shield, d); P.shield -= a; d -= a; fxSh.style.opacity = 1; }
    if (d > 0) { P.health -= d; fxDmg.style.opacity = 1; }
    sfx.hurt();
    if (P.health <= 0) { P.health = 0; P.alive = false; state = 'dead'; sfx.down(); msg('YOU FELL  -  TAP TO REDEPLOY', 99); }
  }
  function killEnemy(e) {
    e.dead = 0.5; score += e.kind === 'elite' ? 300 : 100; sfx.kill();
